name: forge-readonly
on:
  pull_request:
    paths: ['dummy/forge-ro/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build.sh
