name: gate-wf
on:
  pull_request:
    paths: ['dummy/gated/**']
permissions: {}
jobs:
  gate:
    if: ${{ !startsWith(github.head_ref, 'skipgate/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: record
        env:
          HEADSHA: ${{ github.event.pull_request.head.sha }}
          BASESHA: ${{ github.event.pull_request.base.sha }}
          HR: ${{ github.head_ref }}
        run: |
          echo "TESTED sha=$(git rev-parse HEAD) tree=$(git rev-parse 'HEAD^{tree}') ref=$GITHUB_REF headsha=$HEADSHA basesha=$BASESHA"
          if [[ "$HR" =~ --sleep([0-9]+) ]]; then sleep "${BASH_REMATCH[1]}"; fi
          if [[ "$HR" == *--fail* ]]; then echo "gate: fail requested by branch name"; exit 1; fi
          echo "gate ok"
